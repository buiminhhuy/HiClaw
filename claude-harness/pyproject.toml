[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentteams-claude-harness"
version = "0.3.0"
description = "AgentTeams claude-harness worker — delegates the agent loop to Claude Code. Includes the claude-harness-remote developer CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["agentteams", "agent", "claude-code", "ai", "developer-tools"]
authors = [
    { name = "AgentTeams Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Environment :: Console",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    # Matrix relay (claude_harness.matrix) + HTML formatting of replies.
    "mautrix[encryption]>=0.20",
    "markdown-it-py>=3.0",
]

[project.scripts]
claude-harness = "claude_harness.cli:main"
claude-harness-remote = "claude_harness.remote_cli:main"

[project.urls]
Homepage = "https://github.com/agentscope-ai/AgentTeams"
Repository = "https://github.com/agentscope-ai/AgentTeams"
Documentation = "https://github.com/agentscope-ai/AgentTeams/blob/main/harness/README.md"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/claude_harness"]
